<!doctype html>
<html lang="az">
<head>
  <base href="../">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11151c">
  <meta name="description" content="Azərbaycanın ictimai nəqliyyatının modelləşdirilmiş hərəkət xəritəsi.">
  <title>Yolda — ictimai nəqliyyat xəritəsi</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#11151c;color:#edf2f5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    #player{position:fixed;inset:0} #failure{position:fixed;inset:20px auto auto 20px;max-width:36rem;line-height:1.5}
  </style>
</head>
<body>
  <main id="player" aria-label="Azərbaycanın ictimai nəqliyyat xəritəsi"></main>
  <noscript>Xəritədən istifadə üçün JavaScript-i aktiv edin.</noscript>
  <script type="module">
    import {mount} from './player.js?v=20261109i';
    const player = document.getElementById('player');
    mount(player, './baku-day.json?v=20261109i', {language:document.documentElement.lang,localeUrls:true}).catch(error => {
      console.error(error);
      const message = document.createElement('p');
      message.id = 'failure';
      message.textContent = document.documentElement.lang === 'ru' ? 'Не удалось загрузить карту. Обновите страницу.' : document.documentElement.lang === 'en' ? 'Could not load the map. Please reload the page.' : 'Xəritəni yükləmək mümkün olmadı. Səhifəni yeniləyin.';
      document.body.appendChild(message);
    });
  </script>
</body>
</html>
